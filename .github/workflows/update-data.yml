name: Update game data

# Re-fetches champions, augments, items and pick rates, and commits any changes.
on:
  schedule:
    - cron: '0 3 * * *' # 毎日 12:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-data
      - run: npm run build
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain src/data public/img)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data public/img
          git commit -m "Update game data ($(node -p "require('./src/data/meta.json').patch"))"
          git push
